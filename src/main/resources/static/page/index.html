<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Brevlet</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/page/app.css">
    <script src="/page/app.js" defer></script>
</head>
<body>
<header class="masthead main-header">
    <h1 class="wordmark"><a href="#create" aria-label="Brevlet 홈">Brevlet</a></h1>
    <p class="tagline">긴 주소는 짧게, 공유는 원하는 기간만큼.</p>
</header>
<main class="shell link-workspace">
    <div class="form-card">
        <nav aria-label="링크 메뉴">
            <a href="#create" aria-current="page">만들기</a>
            <a href="#lookup">조회</a>
        </nav>
        <form id="create-form" aria-label="링크 만들기" novalidate>
            <label class="field-label" for="original-url">원본 URL</label>
            <div class="input-row">
                <input id="original-url" type="text" inputmode="url" placeholder="https://example.com/event" spellcheck="false" autocapitalize="none">
                <button class="primary" type="submit">단축하기</button>
            </div>
            <fieldset class="periods">
                <legend>만료 기간</legend>
                <label><input type="radio" name="days" value="" checked><span>영구</span></label>
                <label><input type="radio" name="days" value="1"><span>1일</span></label>
                <label><input type="radio" name="days" value="7"><span>7일</span></label>
                <label><input type="radio" name="days" value="30"><span>30일</span></label>
                <label><input type="radio" name="days" value="90"><span>90일</span></label>
                <label><input type="radio" name="days" value="365"><span>1년</span></label>
                <label><input type="radio" name="days" value="custom"><span>직접 입력</span></label>
                <div class="custom-period" hidden>
                    <label for="custom-days">만료 일수</label>
                    <input id="custom-days" type="number" min="1" max="365" step="1" required disabled placeholder="1–365" inputmode="numeric"> 일
                </div>
            </fieldset>
            <details id="raw-editor">
                <summary>요청 본문 편집</summary>
                <label class="hint" for="raw-body">편집기를 열어 둔 상태에서 단축하면 아래 본문이 그대로 전송됩니다.</label>
                <textarea id="raw-body" rows="5" spellcheck="false" autocapitalize="none"></textarea>
            </details>
        </form>
        <form id="lookup-form" aria-label="링크 조회" novalidate hidden>
            <label class="field-label" for="lookup-key">단축 키</label>
            <div class="input-row">
                <input id="lookup-key" type="text" placeholder="aB3dE7kQ" aria-describedby="lookup-help" spellcheck="false" autocapitalize="none">
                <button class="primary" type="submit">조회하기</button>
            </div>
            <p id="lookup-help" class="hint">단축 주소의 마지막 8자리를 입력하세요. <code>brevlet.example/<strong>aB3dE7kQ</strong></code></p>
        </form>
    </div>
    <section id="create-panel" class="workspace" aria-label="링크 만들기 결과 및 상세">
        <p class="notice" role="status"></p>
        <section class="card result" aria-label="생성 결과" hidden>
            <h2>단축 링크</h2>
            <div class="result-row">
                <strong class="short-address"></strong>
                <button class="action copy" type="button" aria-live="polite">복사</button>
            </div>
            <div class="result-meta">
                <p class="expiry"></p>
                <div class="result-links">
                    <button class="lookup-link" type="button">이 링크 조회</button>
                    <a class="open-link" target="_blank" rel="noopener noreferrer" aria-label="단축 링크 열기 (새 창)">링크 열기 <span aria-hidden="true">↗</span></a>
                </div>
            </div>
        </section>
    </section>
    <section id="lookup-panel" class="workspace" aria-label="링크 조회 결과 및 상세" hidden>
        <p class="notice" role="status"></p>
        <section class="card result" aria-label="조회 결과" hidden>
            <h2>링크 정보</h2>
            <dl class="info">
                <dt>원본 URL</dt><dd class="destination"></dd>
                <dt>만료 시각</dt><dd class="expiry"></dd>
                <dt>이동 횟수</dt><dd class="count"></dd>
            </dl>
            <a class="action open-link" target="_blank" rel="noopener noreferrer" aria-label="단축 링크 열기 (새 창)">링크 열기 <span aria-hidden="true">↗</span></a>
        </section>
    </section>
    <template id="trace-template">
        <details class="card trace">
            <summary>요청·응답 상세</summary>
            <p class="trace-empty hint">요청을 보내면 여기에 기록됩니다.</p>
            <div class="exchange" hidden>
                <h3>요청</h3><pre class="request-meta"></pre>
                <h3>요청 본문</h3><pre class="request-body"></pre>
                <h3>응답</h3><pre class="response-meta"></pre>
                <h3>응답 본문</h3><pre class="response-body"></pre>
            </div>
        </details>
    </template>
</main>
</body>
</html>
